
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cube-dashboard
  namespace: pod-cube-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cube-dashboard-reader
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cube-dashboard-reader
subjects:
- kind: ServiceAccount
  name: pod-cube-dashboard
  namespace: pod-cube-demo
roleRef:
  kind: ClusterRole
  name: pod-cube-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
