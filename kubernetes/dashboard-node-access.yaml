
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cube-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cube-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: pod-cube-dashboard
    namespace: pod-cube-demo
roleRef:
  kind: ClusterRole
  name: pod-cube-node-reader
  apiGroup: rbac.authorization.k8s.io
