
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-cube-dashboard
  namespace: pod-cube-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-cube-dashboard
  template:
    metadata:
      labels:
        app: pod-cube-dashboard
    spec:
      serviceAccountName: pod-cube-dashboard
      containers:
        - name: dashboard
          image: pod-status-cube:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: pod-cube-dashboard
  namespace: pod-cube-demo
spec:
  type: NodePort
  selector:
    app: pod-cube-dashboard
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
